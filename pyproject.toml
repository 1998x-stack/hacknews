[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacknews"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
    "email-validator>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
hacknews = "hacknews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["N999"]  # dir name with hyphen in local worktree path (env artifact)

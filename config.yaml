settings:
  timezone: "UTC"
  log_level: "INFO"
  max_recipients_per_scan: 100

# Recipients must be supplied with TO_EMAILS at runtime.
# Do not send production messages to demonstration addresses.
recipients: []

ops:
  # GitHub Actions reports job failures. Configure real alert addresses
  # only when using the long-running local service.
  alert_emails: []
  min_alert_interval_minutes: 60

rules_defaults:
  min_score: 0
  min_comments: 0
  max_age_hours: 24
  top_n: 10
  keywords_include: []
  keywords_exclude: []
  include_self_text: true

jobs:
  - name: "morning_digest"
    cron: "0 8 * * *"
    timezone: "Asia/Shanghai"
    subject: "Morning Hacker News Digest"
    rules:
      top_n: 5
      keywords_include: ["AI", "LLM", "Rust"]
  - name: "evening_top10"
    cron: "0 20 * * *"
    subject: "Evening Hacker News Digest"
    rules:
      min_score: 200
